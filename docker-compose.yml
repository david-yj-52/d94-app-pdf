services:
  d94-pdf-parser:
    image: ghcr.io/david-yj-52/d94-app-pdf:${IMAGE_TAG:-latest}
    container_name: d94-pdf-parser
    restart: unless-stopped
    environment:
      PDF_SERVICE_TOKEN: ${PDF_SERVICE_TOKEN:?PDF_SERVICE_TOKEN is required}
    networks:
      - cloud

networks:
  cloud:
    external: true
    name: ${CLOUD_NETWORK_NAME:-befw-cloud-network}
